{% extends "base.html" %}

{% block title %}Register - EventSphere{% endblock %}

{% block content %}
<div class="container py-5" style="max-width: 440px;">
    <div class="card border-0 shadow rounded-4 p-4 p-sm-5 bg-white">
        <div class="text-center mb-4">
            <span class="brand-badge mb-2"><i class="bi bi-person-plus-fill"></i></span>
            <h4 class="fw-bold text-dark">Create Attendee Account</h4>
            <p class="text-secondary small">Register to book tickets, request venue hire, and join event waitlists</p>
        </div>

        {% if error %}
        <div class="alert alert-danger py-2 small mb-3">
            <i class="bi bi-exclamation-triangle-fill me-1"></i> {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/register">
            <div class="mb-3">
                <label class="form-label small fw-semibold">Username / Email</label>
                <input type="text" name="username" class="form-control" placeholder="e.g. john@student.edu" required>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-semibold">Password</label>
                <input type="password" name="password" class="form-control" placeholder="Create a secure password" required minlength="4">
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mb-3">
                Register Account
            </button>
        </form>

        <div class="text-center small">
            Already have an account? <a href="/login" class="fw-semibold text-primary">Sign In</a>
        </div>
    </div>
</div>
{% endblock %}
